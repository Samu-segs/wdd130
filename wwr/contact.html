<!DOCTYPE html>
<html lang="en">
  
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wild River Rafting | Contact Us</title>
    <meta name="description" content="Contact Wild River Rafting for inquiries, reservations, or feedback. Meet our team, send us a message, and get directions to our location.">
    <link rel="stylesheet" href="styles/rafting.css">
  
    <style>
      .contact-section {
        padding: 40px 20px;
        max-width: 800px;
        margin: auto;
        text-align: center;
      }
  
      .contact-info p {
        font-size: 1.1rem;
        margin: 10px 0;
      }
  
      iframe {
        border: 0;
        width: 100%;
        height: 300px;
        border-radius: 8px;
        margin-bottom: 30px;
      }
  
      .employee-section {
        display: flex;
        justify-content: space-around;
        flex-wrap: wrap;
        gap: 20px;
        margin: 40px auto;
        text-align: center;
      }
  
      .employee {
        max-width: 200px;
      }
  
      .employee img {
        width: 100%;
        border-radius: 50%;
        border: 3px solid #ccc;
      }
  
      .employee figcaption {
        margin-top: 10px;
        font-weight: bold;
      }
  
      form {
        text-align: left;
        background-color: #f9f9f9;
        padding: 25px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
      }
  
      form label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
      }
  
      form input[type="text"],
      form input[type="email"],
      form textarea {
        width: 100%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }
  
      form textarea {
        resize: vertical;
        min-height: 100px;
      }
  
      .radio-group {
        margin-top: 10px;
      }
  
      .radio-group label {
        font-weight: normal;
        display: block;
      }
  
      .checkbox-group {
        margin-top: 15px;
      }
  
      .submit-button {
        margin-top: 20px;
        padding: 10px 20px;
        background-color: #2d7f5e;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 1rem;
      }
  
      footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 20px;
      }
  
      footer a img {
        width: 30px;
        height: 30px;
        margin-left: 10px;
      }
  
      header {
        display: grid;
        grid-template-columns: auto 1fr;
        align-items: center;
        padding: 20px;
        gap: 20px;
      }
  
      header nav {
        display: flex;
        justify-content: flex-end;
        gap: 15px;
      }
  
      header nav a {
        text-decoration: none;
        font-weight: bold;
        color: #333;
      }
  
      header img {
        max-height: 60px;
      }
    </style>
  </head>
  
  <body>
  
    <header>
      <img src="images/z-splash.jpg" alt="Rafting Logo">
      <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="trips.html">Trips</a>
        <a href="contact.html">Contact Us</a>
      </nav>
    </header>
  
    <main>
      <section class="contact-section">
        <h1>Contact Us</h1>
        <div class="contact-info">
          <p><strong>Address:</strong> 123 River Run Road, Adventure Town, CO 80439</p>
          <p><strong>Phone:</strong> (555) 123-4567</p>
          <p><strong>Email:</strong> <a href="mailto:info@wildriverrafting.com">info@wildriverrafting.com</a></p>
        </div>
  
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3065.697125671382!2d-105.4061318846235!3d39.69459057945681!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x876c8d0c0c9be4d1%3A0x4ecad4ff45f5be5a!2sClear%20Creek%20Rafting%20Company!5e0!3m2!1sen!2sus!4v1616348085323!5m2!1sen!2sus"
          allowfullscreen="" loading="lazy">
        </iframe>
      </section>
  
      <section class="employee-section">
        <figure class="employee">
          <img src="images/Sofia.jpg" alt="Emily smiling">
          <figcaption>Emily - Senior Guide</figcaption>
        </figure>
        <figure class="employee">
          <img src="images/Marcus.jpg" alt="Marcus laughing">
          <figcaption>Marcus - Trip Coordinator</figcaption>
        </figure>
        <figure class="employee">
          <img src="images/Emily.jpg" alt="Sofia with sunglasses">
          <figcaption>Sofia - Customer Experience Lead</figcaption>
        </figure>
      </section>
  
      <section class="contact-section">
        <h2>Send Us a Message</h2>
        <form action="#" method="post">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>
  
          <label for="email">Email Address:</label>
          <input type="email" id="email" name="email" required>
  
          <label>Purpose of Message:</label>
          <div class="radio-group">
            <label><input type="radio" name="purpose" value="general" required> General Inquiry</label>
            <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
            <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
          </div>
  
          <label for="message">Message:</label>
          <textarea id="message" name="message" required></textarea>
  
          <div class="checkbox-group">
            <label><input type="checkbox" name="subscribe"> Please subscribe me to the monthly newsletter</label>
          </div>
  
          <button class="submit-button" type="submit">Submit Message</button>
        </form>
      </section>
    </main>
  
    <footer>
      <p>&copy; 2025 Rafting Adventures, All rights reserved | Created by Samuel Gonzalez Silva</p>
      <div>
        <a href="#" title="Facebook">
          <img src="images/face.jpg" alt="Facebook">
        </a>
        <a href="#" title="Twitter">
          <img src="images/x.jpg" alt="Twitter">
        </a>
        <a href="#" title="Instagram">
          <img src="images/Ig.jpg" alt="Instagram">
        </a>
      </div>
    </footer>
  
  </body>
  </html>
